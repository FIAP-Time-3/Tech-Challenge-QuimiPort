name: CI

on:
  push:
    - bruno
    # - fase2/dev
    # - fase2/main
  pull_request:
    - bruno

    # - fase2/dev
    # - fase2/main
jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci
