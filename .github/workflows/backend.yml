name: Backend CI

on:
  push:
    branches:
      - "bruno"
      - "planning_bruno"
      - "fase3/dev"
      - "fase3/main"
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose-db-only.yml"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - "bruno"
      - "planning_bruno"
      - "fase3/dev"
      - "fase3/main"
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose-db-only.yml"
      - ".github/workflows/backend.yml"

jobs:
  pipeline:
    name: Build and Test Node
    runs-on: ubuntu-24.04

    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quimiport_test
          POSTGRES_USER: quimiport_test
          POSTGRES_PASSWORD: quimiport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quimiport_test -d quimiport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_HOSTNAME: localhost
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: quimiport_test
      TEST_DATABASE_USERNAME: quimiport_test
      TEST_DATABASE_PASSWORD: quimiport_test
      PASSWORD_SALT: "4"
      JWT_SECRET: ci-test-only-secret

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Prisma
        run: npx prisma generate --config prisma.test.config.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Execute Tests
        run: npm run test:all

  docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Docker environment
        working-directory: ./backend
        run: |
          cp .env.docker.example .env.docker

      - name: Build and Start Docker Compose
        run: docker compose up -d --build

      - name: Check containers
        run: docker compose ps

      - name: Wait for services
        run: |
          timeout 120s bash -c '
            while true; do
              postgres_status=$(docker inspect --format="{{.State.Health.Status}}" quimiport_postgres 2>/dev/null || echo "unknown")
              api_status=$(docker inspect --format="{{.State.Health.Status}}" $(docker compose ps -q api) 2>/dev/null || echo "unknown")

              echo "PostgreSQL: $postgres_status | API: $api_status"

              if [ "$postgres_status" = "healthy" ] && [ "$api_status" = "healthy" ]; then
                echo "All services are healthy!"
                break
              fi

              sleep 2
            done
          '
      - name: Check PostgreSQL
        run: |
          docker compose exec -T postgres \
            pg_isready -U postgres -d quimiport

      - name: Check API health
        run: |
          curl --fail --retry 10 --retry-delay 2 \
            http://localhost:3000/api/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v
